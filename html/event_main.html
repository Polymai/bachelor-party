<div class="event">
  <div class="event-top">
    <div>
      <h1 id="event-name" class="event-title">Event</h1>
      <div id="event-meta" class="event-meta"></div>
    </div>
    <div class="row">
      <button id="btn-refresh-event" class="btn" type="button">Refresh</button>
    </div>
  </div>

  <ul class="section-tabs" aria-label="Sections">
    <li><button class="section-tab is-active" type="button" data-section="date">Date</button></li>
    <li><button class="section-tab" type="button" data-section="rsvp">RSVP</button></li>
    <li><button class="section-tab" type="button" data-section="place">Place</button></li>
    <li><button class="section-tab" type="button" data-section="cost">Cost</button></li>
    <li><button class="section-tab" type="button" data-section="travel">Travel</button></li>
    <li><button class="section-tab" type="button" data-section="comments">Comments</button></li>
    <li><button class="section-tab" type="button" data-section="restaurants">Restaurants</button></li>
    <li><button class="section-tab" type="button" data-section="hotel">Hotel</button></li>
  </ul>

  <section id="event-section-date" class="panel is-active" aria-label="Date"></section>
  <section id="event-section-rsvp" class="panel" aria-label="RSVP"></section>
  <section id="event-section-place" class="panel" aria-label="Place"></section>
  <section id="event-section-cost" class="panel" aria-label="Cost"></section>
  <section id="event-section-travel" class="panel" aria-label="Travel"></section>
  <section id="event-section-comments" class="panel" aria-label="Comments"></section>
  <section id="event-section-restaurants" class="panel" aria-label="Restaurants"></section>
  <section id="event-section-hotel" class="panel" aria-label="Hotel"></section>
</div>
