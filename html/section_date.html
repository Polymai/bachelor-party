<h2 class="panel-title">Date</h2>
<p class="panel-note">Set the date/time for the weekend.</p>

<div class="field">
  <div class="label">Start</div>
  <input id="date-start" class="input" type="datetime-local" />
</div>
<div class="field">
  <div class="label">End</div>
  <input id="date-end" class="input" type="datetime-local" />
</div>

<div class="row">
  <button id="btn-save-date" class="btn btn-primary" type="button">Save</button>
</div>
<div id="date-msg" class="helper" aria-live="polite"></div>
